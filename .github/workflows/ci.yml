name: CI

on:
  push:
    branches: [mob]
  pull_request:
    branches: [mob]
  workflow_dispatch:

env:
  # Stable synthetic key the metrics job records under (metrics.db keys runs by
  # commit_sha+host) -- decoupled from the Pi's actual hostname so dashboard
  # rows stay under one stable host even if the runner hostname changes.
  METRICS_HOST: armv8m-metrics
  # Every job runs in a container (--user root) whose workspace is bind-mounted
  # with a UID that differs from the git process, so bare `git` calls refuse the
  # repo with "detected dubious ownership". That silently degraded `make`'s
  # version stamp (its git calls have `|| echo no` fallbacks) and hard-failed
  # record.py's `git show -s HEAD` in the codesize/metrics jobs. Inject
  # safe.directory=* via GIT_CONFIG_* env: this is the "command" config scope,
  # which counts as protected configuration, so safe.directory is honored --
  # unlike a repo-scope setting. At workflow scope it covers every job/step's
  # git (vs a `git config --global` step) without accumulating duplicate entries
  # in the persistent runner's ~/.gitconfig on each run.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/matgla/tinycc-armv8m:0.1.0
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # --debug enables CONFIG_TCC_DEBUG so the compiler supports -dump-ir;
        # without it the frontend types/ tests skip (they need IR dumps).
        run: ./configure --enable-cross --enable-O2 --debug

      - name: Build and test
        shell: bash
        env:
          # Write a JUnit report from every pytest run (the final ir_tests run
          # overwrites it last) so the failure collector knows which tests failed.
          PYTEST_ADDOPTS: "--junitxml=/tmp/ci-junit.xml"
        run: |
          virtualenv .venv
          source .venv/bin/activate
          # `shell: bash` runs with -eo pipefail, so a failing make still fails
          # the step even though its output is teed to a log we upload on failure.
          make test CI=1 -j$(nproc) 2>&1 | tee /tmp/make-test.log

      - name: Golden IR snapshot tests
        # Snapshot the per-pass IR against checked-in .expected files. Kept a
        # separate step (and a separate `make` target) from `make test`: it
        # needs -dump-ir-passes, a debug/diagnostic interface, which the
        # --debug build above provides. Runs after `make test` so the cross
        # compiler and venv it depends on already exist.
        shell: bash
        run: |
          source .venv/bin/activate
          make test-golden-ir

      - name: Collect failure artifacts
        if: failure()
        shell: bash
        env:
          MAKE_TEST_LOG: /tmp/make-test.log
          PYTEST_JUNIT_XML: /tmp/ci-junit.xml
        run: |
          source .venv/bin/activate 2>/dev/null || true
          bash scripts/collect_ci_failure_artifacts.sh "$PWD/ci-failure-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: make-test-failure-artifacts
          path: ci-failure-artifacts.tar.gz
          retention-days: 14
          if-no-files-found: warn

  # Code size (tcc-vs-gcc disasm comparison at -O0/-O1/-O2) measured on the fast
  # x86 cloud container and handed to the Pi as a scratch metrics.db artifact.
  # The cross compiler is host-native, but the codesize *numbers* it produces are
  # not -- armv8m-tcc emits identical ARM code regardless of build host -- so the
  # Pi imports these rows via `record.py --import-codesize-from` (below) instead
  # of recompiling the whole corpus 3x itself. That offload is the whole point:
  # the corpus compile is CPU-heavy and slow on the Pi, and it does not need the
  # board, so only the RP2350 perf benchmark stays on the Pi. The container ships
  # the arm-none-eabi toolchain (gcc/objdump/nm) the disasm comparison needs.
  codesize:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/matgla/tinycc-armv8m:0.1.0
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        # submodules: recursive provides the newlib libc headers the corpus
        # compiles need (compile-only -- no newlib build / QEMU here). record.py
        # sparse-fetches the GCC c-torture tests itself (ensure_codesize_corpus).
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build cross compiler
        # --enable-O2/--debug only affect tcc's own binary, not the code it
        # emits, so the codesize numbers are unaffected by this config.
        run: ./configure --enable-cross --enable-O2 --debug && make cross -j$(nproc)

      - name: Set up test venv
        # record.py's codesize child (regression_disasm.py --csv) imports the
        # ir_tests test collector (test_qemu), which needs pytest & friends.
        run: make test-venv

      - name: Record code size (-O0/-O1/-O2) to scratch db
        shell: bash
        run: |
          source .venv/bin/activate
          # No --perf-host (perf runs on the Pi) and no --keep (throwaway db).
          # --codesize-detail fills the per-function table so the Pi's import
          # gets Grafana's drill-down rows too. Tee all logs to an artifact.
          python3 metrics/record.py --db "$RUNNER_TEMP/codesize.db" --rev HEAD \
              --no-correctness --codesize-detail --jobs "$(nproc)" \
              --host "$METRICS_HOST" --branch mob \
              --trigger "${{ github.event_name }}" 2>&1 | tee "$RUNNER_TEMP/codesize.log"

      - name: Upload scratch codesize db
        uses: actions/upload-artifact@v4
        with:
          name: codesize-db
          path: ${{ runner.temp }}/codesize.db
          retention-days: 7
          if-no-files-found: error

      - name: Upload codesize log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesize-log
          path: ${{ runner.temp }}/codesize.log
          if-no-files-found: warn

  # RP2350 hardware perf on the self-hosted Pi -- the only part that needs the
  # board. Code size comes from the cloud `codesize` job's artifact (imported
  # via --import-codesize-from), so the Pi runs ONLY run_benchmark.py, not the
  # slow corpus compile. Both jobs check out the same run SHA (github.sha), so
  # the import matches by commit_sha.
  metrics:
    needs: codesize
    runs-on: [self-hosted, rpi5, pimoroni_pico_plus2]
    timeout-minutes: 120
    concurrency:
      group: metrics-rpi5
      cancel-in-progress: false
    env:
      METRICS_DB: /var/lib/tcc-metrics/metrics.db
      PERF_HOST: 127.0.0.1
      PERF_IDENTITY: /home/runner/.ssh/id_rp
      # safe.directory=* comes from the workflow-level GIT_CONFIG_* env (see top).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # depth 1 is enough: `make cross` stamps a version string via git
          # rev-parse/log -1/diff (no history walk) and record.py runs
          # `git show -s HEAD`.
          fetch-depth: 1

      - name: Build cross compiler
        # armv8m-tcc is a *cross* compiler: it targets ARMv8-M but the binary
        # itself is host-native, so it must be built on this aarch64 Pi rather
        # than shared from an x86_64 runner (an x86_64 build can't exec here --
        # the shell would fall back to interpreting it: "Syntax error: )
        # unexpected"). Needed here because run_benchmark.py builds the RP2350
        # perf firmware with this freshly built armv8m-tcc.
        run: ./configure --enable-cross --enable-O2 --debug && make cross -j$(nproc)

      - name: Download cloud codesize db
        uses: actions/download-artifact@v4
        with:
          name: codesize-db
          path: ${{ runner.temp }}/codesize

      - name: Import codesize + record perf
        # --import-codesize-from copies the cloud job's codesize/compile-time
        # rows (measured at -O0/-O1/-O2) into this run instead of recomputing
        # them locally; --perf-host runs the RP2350 board benchmark. Both land
        # in the real metrics.db under the same run. --keep 20 bounds DB growth.
        run: |
          python3 metrics/record.py --db "$METRICS_DB" --rev HEAD --no-correctness \
              --import-codesize-from "$RUNNER_TEMP/codesize/codesize.db" \
              --host "$METRICS_HOST" --trigger "${{ github.event_name }}" \
              --perf-host "$PERF_HOST" --perf-identity "$PERF_IDENTITY" --perf-strict \
              --branch mob --keep 20

      - name: Verify metrics.db is Grafana-readable
        # A WAL-mode DB writes fine here (job stays green) but Grafana bind-mounts
        # it read-only (:ro) and cannot open a WAL database read-only -- every
        # SELECT tries to write the -wal/-shm sidecars and fails "attempt to write
        # a readonly database", silently breaking the dashboard. Assert the
        # journal mode is not WAL (the persistent header property that breaks the
        # read-only open) and that the recorder actually wrote a row, so that
        # regression turns the job red here instead of surfacing as a broken panel
        # days later. journal_mode is asserted directly rather than via a chmod'd
        # read-only-dir probe because the recorder may run as root, for whom chmod
        # read-only does not block writes -- the probe would false-pass.
        run: |
          python3 - "$METRICS_DB" "$METRICS_HOST" <<'PY'
          import sqlite3, sys
          db, host = sys.argv[1], sys.argv[2]
          conn = sqlite3.connect(f"file:{db}?mode=ro", uri=True)   # open like Grafana does
          mode = conn.execute("PRAGMA journal_mode").fetchone()[0]
          if mode.lower().startswith("wal"):
              sys.exit(f"metrics.db journal_mode={mode!r}: Grafana bind-mounts it "
                       f"read-only and cannot open a WAL database read-only. "
                       f"Set PRAGMA journal_mode=DELETE in metrics/schema.sql.")
          n = conn.execute("SELECT COUNT(*) FROM runs WHERE host=?", (host,)).fetchone()[0]
          if n == 0:
              sys.exit(f"metrics.db has no runs for host={host}: recorder wrote nothing")
          print(f"grafana-readable OK: journal_mode={mode}, {n} run(s) for host={host}")
          PY

      - name: Gate
        if: ${{ vars.METRICS_GATE_ENABLED == 'true' }}
        run: python3 metrics/gate.py --db "$METRICS_DB" --rev HEAD --host "$METRICS_HOST" --strict
